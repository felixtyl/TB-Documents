<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Production Document Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      @media print {
        /* The printable copy lives in a portal appended directly to <body>,
           completely outside the app's #root tree (see PrintPortal in
           App.jsx). That sidesteps every issue that came from trying to
           reposition the on-screen modal for print: fixed/absolute
           positioning gets clipped to a single page by the browser's print
           engine, and flex ancestors push content around. Hiding #root
           entirely and showing only the portal's plain, unpositioned div
           means the printed content flows and paginates normally, exactly
           like a regular multi-page document. */
        #root { display: none !important; }
        #print-portal-root { display: block !important; padding: 24px; font-family: 'Inter', -apple-system, sans-serif; }
      }
      #print-portal-root { display: none; }
    </style>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
