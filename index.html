<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Production Document Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      @media print {
        body * { visibility: hidden; }
        #print-area, #print-area * { visibility: visible; }

        /* The modal is normally centered on screen via fixed positioning and
           flexbox. Left as-is for print, that centering pushes the content
           down by however much empty space is left above/below it on the
           page. Flatten it back into normal document flow instead. */
        .modal-backdrop {
          position: static !important;
          display: block !important;
          background: none !important;
          padding: 0 !important;
        }
        .modal-inner {
          position: static !important;
          max-width: none !important;
          max-height: none !important;
          overflow: visible !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          padding: 0 !important;
          margin: 0 !important;
          width: auto !important;
        }
        #print-area {
          position: static !important;
          width: auto !important;
          padding: 0 !important;
        }
      }
    </style>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
