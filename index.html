<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Production Document Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
      rel="stylesheet"
    />
    <style>
      @media print {
        body * { visibility: hidden; }
        #print-area, #print-area * { visibility: visible; }

        /* The app's root layout is display:flex (sidebar + main content).
           If the modal backdrop drops out of fixed positioning during print,
           it becomes a THIRD flex item alongside them instead of an
           independent overlay — which is what pushed content off to the
           right in the previous attempt. Keeping it fixed avoids that,
           while switching from center-aligned to top-aligned removes the
           blank gap that centering caused. */
        .modal-backdrop {
          position: fixed !important;
          inset: 0 !important;
          display: flex !important;
          align-items: flex-start !important;
          justify-content: stretch !important;
          background: none !important;
          padding: 0 !important;
          overflow: visible !important;
        }
        .modal-inner {
          position: static !important;
          max-width: none !important;
          max-height: none !important;
          overflow: visible !important;
          box-shadow: none !important;
          border-radius: 0 !important;
          padding: 0 !important;
          margin: 0 !important;
          width: 100% !important;
        }
        #print-area {
          position: static !important;
          width: 100% !important;
          padding: 0 !important;
        }
      }
    </style>
  </head>
  <body style="margin:0;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
